name: PTY startup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-pty:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Setup Rust
        run: rustup toolchain install --no-self-update
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci
          save-if: false
      - name: Capture PowerShell startup
        shell: pwsh
        run: |
          $PSVersionTable
          Get-Command powershell.exe | Format-List Source,Version
          Get-Item "$env:WINDIR\System32\conhost.exe" | Select-Object -ExpandProperty VersionInfo
      - name: Exercise real PTY startup
        shell: bash
        run: |
          for round in 1 2 3 4 5 6; do
            echo "PTY diagnostic round $round"
            cargo test -p mt-terminal --test terminal_smoke -- --nocapture || exit $?
          done
